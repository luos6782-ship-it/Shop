<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171512" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Sloth</title>
    <style>
      /* Solo se ve si el arranque no llega a montar la app (por ejemplo, un teléfono con una versión vieja guardada). */
      #rescate {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #171512;
        color: #ede6d6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      #rescate[hidden] { display: none; }
      #rescate h1 { margin: 0 0 8px; font-size: 20px; }
      #rescate p { margin: 0 0 18px; max-width: 380px; color: #9a927f; font-size: 14px; line-height: 1.5; }
      #rescate button {
        padding: 14px 22px;
        font-size: 16px;
        font-weight: 600;
        color: #140a2e;
        background: #9b7bff;
        border: 0;
        border-radius: 12px;
      }
      #rescate button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="rescate" hidden>
      <div>
        <h1>Sloth no terminó de abrir</h1>
        <p>Puede ser una versión vieja guardada en este teléfono. El botón borra esa copia y vuelve a cargar la app.</p>
        <button id="reintentar" type="button">Recargar Sloth</button>
      </div>
    </div>
    <script type="module">
      // Si un cambio a medias rompió un import, la app no llega a montarse y Vite ya no la recarga: sus actualizaciones
      // son de módulos que nunca cargaron. Con la página vacía, el siguiente cambio la recarga entera.
      import.meta.hot?.on('vite:beforeUpdate', () => {
        if (!document.getElementById('root').hasChildNodes()) location.reload()
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Solo con HTTPS (donde el navegador de Android deja instalar la app); en la app de escritorio, que va por
      // `http://localhost`, no se registra y nada cambia.
      if (location.protocol === 'https:') navigator.serviceWorker?.register('/sw.js').catch(() => {})
    </script>
    <script>
      // Si el arranque no monta nada, en vez de una pantalla en blanco se ofrece borrar la copia guardada y recargar.
      ;(() => {
        const raiz = document.getElementById('root')
        const rescate = document.getElementById('rescate')
        if (!raiz || !rescate) return
        let aviso
        const observador = new MutationObserver(() => {
          if (!raiz.hasChildNodes()) return
          rescate.hidden = true
          clearTimeout(aviso)
          observador.disconnect()
        })
        observador.observe(raiz, { childList: true })
        aviso = setTimeout(() => {
          if (!raiz.hasChildNodes()) rescate.hidden = false
        }, 10000)
        document.getElementById('reintentar').addEventListener('click', async () => {
          try {
            if (window.caches) {
              const claves = await caches.keys()
              await Promise.all(claves.map((clave) => caches.delete(clave)))
            }
            const registros = (await navigator.serviceWorker?.getRegistrations?.()) ?? []
            await Promise.all(registros.map((registro) => registro.unregister()))
          } catch { /* Sin caché ni service worker igual se recarga. */ }
          location.reload()
        })
      })()
    </script>
  </body>
</html>
