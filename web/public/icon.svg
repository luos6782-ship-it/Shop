    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sloth-fondo)" />
  <path d="M 212 172 L 362 256 L 212 340 Z" fill="#ffffff" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />
  <circle cx="384" cy="128" r="19" fill="#ffffff" fill-opacity="0.92" />
</svg>
